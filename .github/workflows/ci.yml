name: Serenity checks

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: serenity-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-browser-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python integration checks
        run: |
          python3 backend/test_server.py
          python3 backend/test_messaging.py
          python3 backend/test_account_discovery.py
          python3 backend/test_workday_report.py
          python3 backend/test_workday_schedule.py
          python3 backend/test_quota_guard.py
          python3 backend/test_free_model_plan.py
          python3 backend/test_cloud_model_pilot.py
          python3 backend/test_company_office.py
          python3 backend/test_company_manager.py
          python3 backend/test_engineering_pipeline.py
          python3 backend/test_company_quality_gate.py
          python3 backend/test_module4_providers.py
          python3 backend/test_module4_pipeline.py
      - name: Generate sample Obsidian company HQ
        run: |
          python3 -m company.demo --vault "$RUNNER_TEMP/serenity-vault" > "$RUNNER_TEMP/company-summary.json"
          test -s "$RUNNER_TEMP/serenity-vault/Serenity Company.canvas"
      - name: Upload sample company HQ artifact
        uses: actions/upload-artifact@v4
        with:
          name: serenity-company-hq-simulated
          path: |
            ${{ runner.temp }}/serenity-vault/
            ${{ runner.temp }}/company-summary.json
          retention-days: 7
      - name: Generate reviewable engineering evidence and Obsidian HQ
        run: |
          python3 -m company.engineering_pipeline \
            --task config/engineering_demo_task.json \
            --source-root . \
            --artifact-root "$RUNNER_TEMP/engineering-review" \
            --db "$RUNNER_TEMP/company-engineering.sqlite3" \
            > "$RUNNER_TEMP/engineering-summary.json"
          python3 -m json.tool "$RUNNER_TEMP/engineering-summary.json" > /dev/null
          test -s "$RUNNER_TEMP/engineering-review/proposed.patch"
          test -s "$RUNNER_TEMP/engineering-review/qa-review.json"
          test -s "$RUNNER_TEMP/engineering-review/obsidian-vault/Serenity HQ/Engineering/run-1.md"
      - name: Upload engineering department preview
        uses: actions/upload-artifact@v4
        with:
          name: serenity-engineering-offline-evidence
          path: |
            ${{ runner.temp }}/engineering-review/
            ${{ runner.temp }}/engineering-summary.json
          retention-days: 7
      - name: Module 4 real Serenity task / mock models / QA / Obsidian preview
        run: |
          python3 -m company.module4_pipeline \
            --task config/module4_destination_task.json \
            --root . \
            --artifacts "$RUNNER_TEMP/module4-evidence" \
            --db "$RUNNER_TEMP/module4-company.sqlite3" \
            > "$RUNNER_TEMP/module4-summary.json"
          python3 -m json.tool "$RUNNER_TEMP/module4-summary.json" > /dev/null
          test -s "$RUNNER_TEMP/module4-evidence/proposed.patch"
          test -s "$RUNNER_TEMP/module4-evidence/reviewer-output.json"
          test -s "$RUNNER_TEMP/module4-evidence/obsidian-vault/Serenity HQ/Engineering/module4-1.md"
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"module4-summary.json"; d=json.loads(p.read_text()); assert d["mode"]=="mock" and not d["github_writes"] and not d["manager_commit_eligible"] and not d["functional_tests_executed"]'
      - name: Upload Module 4 department QA preview
        uses: actions/upload-artifact@v4
        with:
          name: serenity-module4-engineering-evidence
          path: |
            ${{ runner.temp }}/module4-evidence/
            ${{ runner.temp }}/module4-summary.json
          retention-days: 7
      - name: Dependency-free JavaScript checks
        run: |
          node backend/test_chat_ui.js
          node backend/test_destination_picker.js
          node backend/test_feed_hub.js
          node backend/test_studio_grouping.js
          node backend/test_studio_publication.js

  react-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nomad-canvas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        # The prototype does not yet commit a lockfile. Add one before changing
        # this to npm ci so dependency installation becomes reproducible.
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
