name: Serenity Module 4 - manual engineering evidence

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: serenity-module4-offline
  cancel-in-progress: false

jobs:
  module4-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify provider, quota and source safety contracts
        run: |
          python3 backend/test_module4_providers.py
          python3 backend/test_module4_pipeline.py
      - name: Generate evidence for real Serenity test issue 22, mock models
        run: |
          unset GROQ_API_KEY OPENAI_API_KEY GEMINI_API_KEY ANTHROPIC_API_KEY
          python3 -m company.module4_pipeline \
            --task config/module4_destination_task.json \
            --root . \
            --artifacts "$RUNNER_TEMP/module4-evidence" \
            --db "$RUNNER_TEMP/module4-ledger.sqlite3" \
            > "$RUNNER_TEMP/module4-summary.json"
          test -s "$RUNNER_TEMP/module4-evidence/proposed.patch"
          test -s "$RUNNER_TEMP/module4-evidence/obsidian-vault/Serenity HQ/Engineering/module4-1.md"
          python3 -m json.tool "$RUNNER_TEMP/module4-summary.json" > /dev/null
      - name: Attach non-production candidate and HQ
        uses: actions/upload-artifact@v4
        with:
          name: serenity-module4-safe-candidate
          path: |
            ${{ runner.temp }}/module4-evidence/
            ${{ runner.temp }}/module4-summary.json
          retention-days: 7
