<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2eee4">
  <meta name="description" content="Discover travel stories and places shared on Serenity.">
  <meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Serenity">
  <title>Feed — Serenity</title>
  <link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="serenity-icon-192.png">
  <link rel="stylesheet" href="liquid-toolbar.css"><link rel="stylesheet" href="app-shell.css"><link rel="stylesheet" href="social-feed.css"><link rel="stylesheet" href="feed-hub.css">
  <script>
    function openLegacyStudio() {
      if (location.hash === '#feeds') location.replace('studio.html' + location.search);
    }
    openLegacyStudio();
    window.addEventListener('hashchange', openLegacyStudio);
  </script>
</head>
<body data-app-view="home">
  <header class="topbar app-header">
    <a class="app-brand" href="home.html" aria-label="Serenity home"><img src="serenity-logo.svg" alt="">serenity</a>
    <h1 class="app-header-title">Feed</h1>
  </header>
  <main class="shell">
    <section class="social-home" id="home-feed" aria-label="Community travel feed">
      <div class="social-layout">
        <div class="social-stream">
          <p id="postStatus" class="social-status" role="status" aria-live="polite">Loading community stories…</p>
          <div id="postList" class="social-posts"></div>
          <button id="postMore" class="social-more" type="button" hidden>Load more stories ↓</button>
        </div>
      </div>
    </section>
  </main>
  <script src="shared-theme.js"></script><script src="app-client.js"></script><script src="map-core.js"></script><script src="feed-hub.js"></script><script src="social-feed.js"></script><script src="liquid-toolbar.js"></script><script src="app-pwa.js"></script>
</body>
</html>
